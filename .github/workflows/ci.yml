name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the app
        run: scripts/bundle.sh

      - name: Keep the build for a week
        uses: actions/upload-artifact@v5
        with:
          name: RockSign-${{ github.sha }}
          path: dist/RockSign-*.dmg
          retention-days: 7
